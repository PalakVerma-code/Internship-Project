services:
  - type: web
    name: aiagent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: VECTOR_BACKEND
        value: "supabase"
      - key: SUPABASE_DOCUMENT_BUCKET
        value: "compliance-documents"
      - key: TAVILY_API_KEY
        sync: false
      - key: USE_SQLITE_MEMORY
        value: "false"